server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Audio uploads — nginx defaults to a 1 MB limit
    client_max_body_size 100m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --- API: strip /api, forward to the backend ---
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # Generation can run for minutes; nginx defaults to 60s
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- Files the backend serves: keep the path ---
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /output/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # --- Grafana: keep the path ---
    location /grafana/ {
        proxy_pass http://grafana:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # --- Hashed assets: safe to cache forever ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # --- Everything else: the React app ---
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header Referrer-Policy strict-origin-when-cross-origin;
    }
}