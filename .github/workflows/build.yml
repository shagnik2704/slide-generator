name: Build Images
on:
  push:
    branches: [main, rewrite/infra]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: backend
            context: .
            file: docker/backend.Dockerfile
          - name: worker
            context: .
            file: docker/worker.Dockerfile
          - name: frontend
            context: ./chatbot-ui
            file: chatbot-ui/Dockerfile
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
    
      - name: Work out image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
  
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Work out the image tag
        id: tag
        run: echo "value=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Copy config to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          proxy_host:     ${{ secrets.GATEWAY_HOST }}
          proxy_username: ${{ secrets.GATEWAY_USER }}
          proxy_key:      ${{ secrets.GATEWAY_SSH_KEY }}
          host:     ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          source: "compose.yaml,deploy"
          target: ${{ secrets.PROJECT_PATH }}

      - name: Pull images and restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          TAG: ${{ steps.tag.outputs.value }}
        with:
          proxy_host:     ${{ secrets.GATEWAY_HOST }}
          proxy_username: ${{ secrets.GATEWAY_USER }}
          proxy_key:      ${{ secrets.GATEWAY_SSH_KEY }}
          host:     ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TAG
          script: |
            set -euo pipefail
            cd ${{ secrets.PROJECT_PATH }}

            if grep -q '^IMAGE_TAG=' .env; then
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=$TAG|" .env
            else
              echo "IMAGE_TAG=$TAG" >> .env
            fi

            docker compose pull
            docker compose up -d --remove-orphans

            # Grafana reads provisioning/datasources/*.yaml only at startup —
            # unlike dashboards, which it re-reads every updateIntervalSeconds.
            # `up -d` won't recreate Grafana when just a mounted file changed
            # (compose.yaml is identical), so a datasource edit would ship to
            # the server and silently never take effect. Restart unconditionally:
            # it costs ~10s on a service nothing depends on, and that is cheaper
            # than a config change that looks deployed but isn't.
            # Non-fatal: set -e is active, and a Grafana hiccup should not abort
            # the run before the backend/worker health check below gets to gate
            # the deploy. Surfaced as a GitHub warning annotation instead.
            docker compose restart grafana \
              || echo "::warning::grafana restart failed; datasource provisioning changes may not be live"

            echo "Waiting for backend and whisper-worker health checks..."
            healthy=0
            for i in $(seq 1 24); do
              backend_status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q backend)" 2>/dev/null || echo "starting")
              worker_status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q whisper-worker)" 2>/dev/null || echo "starting")
              echo "  [$i/24] backend=$backend_status whisper-worker=$worker_status"

              if [ "$backend_status" = "healthy" ] && [ "$worker_status" = "healthy" ]; then
                healthy=1
                break
              fi
              if [ "$backend_status" = "unhealthy" ] || [ "$worker_status" = "unhealthy" ]; then
                break
              fi
              sleep 10
            done

            docker compose ps

            if [ "$healthy" != "1" ]; then
              echo "::error::Deploy did not reach a healthy state within the timeout"
              echo "--- backend logs ---"
              docker compose logs --tail 50 backend
              echo "--- whisper-worker logs ---"
              docker compose logs --tail 50 whisper-worker
              exit 1
            fi

            echo "Deploy verified: backend and whisper-worker are healthy"
