<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" role="img"
     aria-label="Script Chat LangGraph state machine: ingest flows into four stages — grounding, metadata, generation, compliance — and each stage ends in a review gate that calls interrupt() to pause for the user, who either approves to advance or edits, looping through the stage's edit node. State is checkpointed to PostgreSQL so threads survive restarts.">
  <title>Script Chat — 12-node LangGraph state machine with human review gates</title>
  <style>
    :root {
      --bg: #ffffff; --ink: #1c2540; --muted: #5a6478;
      --line: #5a6a9f; --ok: #1e7a3a;
      --app-f: #eef1fa; --app-s: #2D3E8E;
      --gate-f: #fdf0e7; --gate-s: #e05d10;
      --edit-f: #f2f4f7; --edit-s: #8b95a8;
      --db-f: #f3eefb; --db-s: #7a5cb8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --ink: #e7ecf8; --muted: #9aa6c0;
        --line: #8b9cd8; --ok: #5fd382;
        --app-f: #1a2340; --app-s: #7d92e0;
        --gate-f: #3a2413; --gate-s: #ff9550;
        --edit-f: #1a2130; --edit-s: #6b7893;
        --db-f: #241b3a; --db-s: #a98ae0;
      }
    }
    text { font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
    .t  { font-size: 13.5px; font-weight: 600; }
    .s  { font-size: 11px; fill: var(--muted); }
    .el { font-size: 10.5px; fill: var(--muted); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
    .edge { stroke: var(--line); stroke-width: 1.6; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .head { fill: var(--line); }
    .card { stroke-width: 1.6; rx: 9; }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path class="head" d="M0,0 L9,3.5 L0,7 z"/>
    </marker>
  </defs>

  <rect width="1080" height="430" fill="var(--bg)"/>

  <!-- work row -->
  <rect x="36" y="60" width="118" height="52" class="card" fill="var(--app-f)" stroke="var(--app-s)"/>
  <text x="95" y="83" text-anchor="middle" class="t">ingest</text>
  <text x="95" y="99" text-anchor="middle" class="s">outline in</text>

  <rect x="216" y="60" width="130" height="52" class="card" fill="var(--app-f)" stroke="var(--app-s)"/>
  <text x="281" y="83" text-anchor="middle" class="t">ground</text>
  <text x="281" y="99" text-anchor="middle" class="s">web-grounded facts</text>

  <rect x="418" y="60" width="130" height="52" class="card" fill="var(--app-f)" stroke="var(--app-s)"/>
  <text x="483" y="83" text-anchor="middle" class="t">metadata</text>
  <text x="483" y="99" text-anchor="middle" class="s">title · FOSS · level</text>

  <rect x="620" y="60" width="130" height="52" class="card" fill="var(--app-f)" stroke="var(--app-s)"/>
  <text x="685" y="83" text-anchor="middle" class="t">generate</text>
  <text x="685" y="99" text-anchor="middle" class="s">full script</text>

  <rect x="822" y="60" width="130" height="52" class="card" fill="var(--app-f)" stroke="var(--app-s)"/>
  <text x="887" y="83" text-anchor="middle" class="t">compliance</text>
  <text x="887" y="99" text-anchor="middle" class="s">25-criteria check</text>

  <circle cx="1022" cy="86" r="22" fill="none" stroke="var(--ok)" stroke-width="2"/>
  <circle cx="1022" cy="86" r="16" fill="var(--ok)" opacity="0.15"/>
  <text x="1022" y="90" text-anchor="middle" class="t" font-size="11" fill="var(--ok)">END</text>

  <line x1="154" y1="86" x2="212" y2="86" class="edge" marker-end="url(#a)"/>

  <!-- gates row -->
  <rect x="216" y="196" width="130" height="56" class="card" fill="var(--gate-f)" stroke="var(--gate-s)"/>
  <text x="281" y="219" text-anchor="middle" class="t">ground_review</text>
  <text x="281" y="236" text-anchor="middle" class="s">interrupt()</text>

  <rect x="418" y="196" width="130" height="56" class="card" fill="var(--gate-f)" stroke="var(--gate-s)"/>
  <text x="483" y="219" text-anchor="middle" class="t">metadata_review</text>
  <text x="483" y="236" text-anchor="middle" class="s">interrupt()</text>

  <rect x="620" y="196" width="130" height="56" class="card" fill="var(--gate-f)" stroke="var(--gate-s)"/>
  <text x="685" y="219" text-anchor="middle" class="t">script_review</text>
  <text x="685" y="236" text-anchor="middle" class="s">interrupt()</text>

  <rect x="822" y="196" width="130" height="56" class="card" fill="var(--gate-f)" stroke="var(--gate-s)"/>
  <text x="887" y="219" text-anchor="middle" class="t">compliance_review</text>
  <text x="887" y="236" text-anchor="middle" class="s">interrupt()</text>

  <!-- work -> gate -->
  <line x1="281" y1="112" x2="281" y2="192" class="edge" marker-end="url(#a)"/>
  <line x1="483" y1="112" x2="483" y2="192" class="edge" marker-end="url(#a)"/>
  <line x1="685" y1="112" x2="685" y2="192" class="edge" marker-end="url(#a)"/>
  <line x1="887" y1="112" x2="887" y2="192" class="edge" marker-end="url(#a)"/>

  <!-- gate approve -> next work -->
  <line x1="346" y1="210" x2="414" y2="116" class="edge" marker-end="url(#a)"/>
  <text x="366" y="152" text-anchor="middle" class="el">approve</text>
  <line x1="548" y1="210" x2="616" y2="116" class="edge" marker-end="url(#a)"/>
  <text x="568" y="152" text-anchor="middle" class="el">approve</text>
  <line x1="750" y1="210" x2="818" y2="116" class="edge" marker-end="url(#a)"/>
  <text x="770" y="152" text-anchor="middle" class="el">approve</text>
  <line x1="952" y1="212" x2="1010" y2="104" class="edge" marker-end="url(#a)"/>
  <text x="996" y="160" text-anchor="middle" class="el">approve</text>

  <!-- edit row -->
  <rect x="216" y="322" width="130" height="50" class="card" fill="var(--edit-f)" stroke="var(--edit-s)"/>
  <text x="281" y="344" text-anchor="middle" class="t">ground_edit</text>
  <text x="281" y="360" text-anchor="middle" class="s">apply user changes</text>

  <rect x="418" y="322" width="130" height="50" class="card" fill="var(--edit-f)" stroke="var(--edit-s)"/>
  <text x="483" y="344" text-anchor="middle" class="t">metadata_edit</text>
  <text x="483" y="360" text-anchor="middle" class="s">apply user changes</text>

  <rect x="620" y="322" width="130" height="50" class="card" fill="var(--edit-f)" stroke="var(--edit-s)"/>
  <text x="685" y="344" text-anchor="middle" class="t">edit</text>
  <text x="685" y="360" text-anchor="middle" class="s">LLM or manual edit</text>

  <!-- gate <-> edit loops -->
  <line x1="262" y1="252" x2="262" y2="318" class="edge" marker-end="url(#a)"/>
  <text x="252" y="290" text-anchor="end" class="el">edit</text>
  <line x1="300" y1="318" x2="300" y2="256" class="edge" marker-end="url(#a)"/>
  <line x1="464" y1="252" x2="464" y2="318" class="edge" marker-end="url(#a)"/>
  <text x="454" y="290" text-anchor="end" class="el">edit</text>
  <line x1="502" y1="318" x2="502" y2="256" class="edge" marker-end="url(#a)"/>
  <line x1="666" y1="252" x2="666" y2="318" class="edge" marker-end="url(#a)"/>
  <text x="656" y="290" text-anchor="end" class="el">edit</text>
  <line x1="704" y1="318" x2="704" y2="256" class="edge" marker-end="url(#a)"/>

  <!-- checkpoint note -->
  <rect x="822" y="308" width="230" height="78" class="card dash" fill="var(--db-f)" stroke="var(--db-s)"/>
  <text x="937" y="332" text-anchor="middle" class="t" font-size="12.5">PostgreSQL checkpoints</text>
  <text x="937" y="350" text-anchor="middle" class="s">AsyncPostgresSaver — every step saved;</text>
  <text x="937" y="366" text-anchor="middle" class="s">threads resume after restarts &amp; deploys;</text>
  <text x="937" y="382" text-anchor="middle" class="s">powers version history + revert</text>

  <!-- gate legend -->
  <rect x="36" y="196" width="130" height="56" rx="9" fill="none" stroke="var(--gate-s)" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="101" y="219" text-anchor="middle" class="s" font-weight="600">orange = review gate</text>
  <text x="101" y="236" text-anchor="middle" class="s">graph pauses for a human</text>
</svg>
