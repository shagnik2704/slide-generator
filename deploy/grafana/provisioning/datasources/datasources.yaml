apiVersion: 1

datasources:
  - name: Prometheus
    uid: slide-generator-prometheus
    type: prometheus
    url: http://prometheus:9090
    access: proxy
    isDefault: true
    editable: false

  - name: Postgres
    uid: slide-generator-postgres
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: grafana_ro
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
    jsonData:
      # Must live under jsonData, not the legacy top-level `database:` key.
      # The backend still reads the legacy field, so queries succeed via the
      # API either way — but the frontend only looks here, and without it
      # every panel fails with "no default database configured".
      database: spoken_tutorial
      sslmode: disable
      postgresVersion: 1600
    isDefault: false
    editable: false
