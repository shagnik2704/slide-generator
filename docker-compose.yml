services:
  backend:
    build: .
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./output:/app/output
      - ./static:/app/static
    env_file: .env
    restart: always

  frontend:
    build:
      context: ./chatbot-ui
      args:
        - VITE_API_URL=/api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    restart: always
